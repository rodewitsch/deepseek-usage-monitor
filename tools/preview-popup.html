<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="popupTitle">DeepSeek Usage Monitor</title>
    <link rel="stylesheet" href="/src/popup/popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img class="brand__logo" src="/icons/icon128.png" alt="" width="64" height="64" />
        <div>
          <h1 data-i18n="popupTitle">DeepSeek Usage Monitor</h1>
          <p id="updated" class="muted" data-i18n="popupLoading">Loading…</p>
        </div>
      </div>
      <div class="header__actions">
        <a
          id="open-usage"
          class="icon-button"
          href="https://platform.deepseek.com/usage"
          target="_blank"
          rel="noreferrer"
          data-i18n-title="openUsagePage"
          data-i18n-aria-label="openUsagePage"
          title="Open usage page"
          aria-label="Open usage page"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M14 4h6v6M20 4l-8.5 8.5M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"
            />
          </svg>
        </a>
        <button
          id="refresh"
          class="icon-button"
          data-i18n-title="refreshNow"
          data-i18n-aria-label="refreshNow"
          title="Refresh now"
          aria-label="Refresh now"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 12a8 8 0 1 1-2.34-5.66" />
              <path d="M20 4v4h-4" />
            </g>
          </svg>
        </button>
        <button
          id="open-options"
          class="icon-button"
          data-i18n-title="settings"
          data-i18n-aria-label="settings"
          title="Settings"
          aria-label="Settings"
        >
          <span class="icon-button__glyph" aria-hidden="true">⚙</span>
        </button>
      </div>
    </header>

    <div id="error" class="banner banner--error" hidden>
      <span id="error-text"></span>
      <button id="error-fix" class="link-button" data-i18n="errorFix">Fix</button>
    </div>

    <a
      id="status"
      class="status"
      href="https://status.deepseek.com/"
      target="_blank"
      rel="noreferrer"
      data-i18n-title="openStatusPage"
      title="Open status page"
      hidden
    >
      <span id="status-icon" class="status__icon" aria-hidden="true"></span>
      <span id="status-text" class="status__text">—</span>
      <svg class="status__arrow" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
        <path
          fill="currentColor"
          d="M5 12h12m0 0-4-4m4 4-4 4"
          stroke="currentColor"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </a>

    <div id="layout" class="layout">
      <div class="section-wrap" data-section="summary">
        <section class="cards">
          <article class="card card--primary">
            <span class="card__label" data-i18n="walletBalance">Wallet balance</span>
            <strong id="balance" class="card__value">—</strong>
            <span id="balance-detail" class="card__hint">—</span>
          </article>
          <article class="card">
            <span class="card__label" data-i18n="spentToday">Spent today</span>
            <strong id="today-cost" class="card__value">—</strong>
            <span id="today-tokens" class="card__hint">—</span>
          </article>
        </section>
      </div>

      <div class="section-wrap" data-section="budgets">
        <section id="budgets" class="budgets" hidden>
          <div id="budget-list" class="budget-list"></div>
        </section>
      </div>

      <div class="section-wrap" data-section="forecast">
        <section id="forecast" class="section" hidden>
          <div class="forecast">
            <span class="forecast__label" data-i18n="forecastTitle">Projected today</span>
            <strong id="forecast-value" class="forecast__value">—</strong>
            <span id="forecast-note" class="forecast__note"></span>
          </div>
        </section>
      </div>

      <div class="section-wrap" data-section="compare">
        <section id="compare" class="section" hidden>
          <div class="section__head">
            <h2 data-i18n="compareTitle">Comparison</h2>
            <span id="history-range" class="muted"></span>
          </div>
          <div class="compare">
            <div class="compare__item">
              <div class="compare__row">
                <span class="compare__label" data-i18n="compareToday">Today vs. yesterday</span>
                <span id="compare-today-delta" class="compare__delta">—</span>
              </div>
              <span id="compare-today-note" class="compare__note"></span>
            </div>
            <div class="compare__item">
              <div class="compare__row">
                <span class="compare__label" data-i18n="compareMonth">This month vs. last</span>
                <span id="compare-month-delta" class="compare__delta">—</span>
              </div>
              <span id="compare-month-note" class="compare__note"></span>
            </div>
            <div id="depletion-row" class="compare__item" hidden>
              <div class="compare__row">
                <span class="compare__label" data-i18n="depletionTitle">Balance runs out</span>
                <span id="depletion-value" class="compare__delta">—</span>
              </div>
              <span id="depletion-note" class="compare__note"></span>
            </div>
          </div>
        </section>
      </div>

      <div class="section-wrap" data-section="chart">
        <section class="section">
          <div class="section__head">
            <h2 data-i18n="recentSpend">Recent spend</h2>
            <span id="chart-total" class="muted"></span>
          </div>
          <div
            id="chart"
            class="chart"
            role="img"
            data-i18n-aria-label="chartAria"
            aria-label="Daily spend for the last days"
          ></div>
          <div id="chart-legend" class="legend" hidden></div>
        </section>
      </div>

      <div class="section-wrap" data-section="models">
        <section id="models" class="section" hidden>
          <div class="section__head">
            <h2 data-i18n="modelsTitle">By model</h2>
            <span id="models-total" class="muted"></span>
          </div>
          <ul id="model-list" class="model-list"></ul>
          <p id="cache-note" class="cache-note" hidden></p>
        </section>
      </div>

      <div class="section-wrap" data-section="keys">
        <section class="section">
          <div class="section__head">
            <h2 data-i18n="apiKeys">API keys</h2>
            <div class="section__tools">
              <span id="key-selected" class="muted"></span>
              <button id="key-clear" class="link-button" data-i18n="allKeys" hidden>All keys</button>
            </div>
          </div>
          <ul id="key-list" class="key-list"></ul>
          <p id="key-empty" class="muted empty" data-i18n="noPerKeyUsage" hidden>
            No per-key usage in this period.
          </p>
        </section>
      </div>

      <div class="section-wrap" data-section="export">
        <section class="section">
          <div class="section__head">
            <h2 data-i18n="exportTitle">Export</h2>
            <span id="export-note" class="muted"></span>
          </div>
          <div class="export-row">
            <button id="export-csv" class="button button--small" data-i18n="exportCsv">CSV</button>
            <button id="export-json" class="button button--small" data-i18n="exportJson">JSON</button>
          </div>
        </section>
      </div>
    </div>

    <script type="module" src="/tools/preview-popup.js"></script>
  </body>
</html>
