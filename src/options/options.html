<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Usage Monitor — Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="page">
      <header class="page__head">
        <img src="../../icons/icon48.png" alt="" width="40" height="40" />
        <div>
          <h1>DeepSeek Usage Monitor</h1>
          <p class="muted">Toolbar badge, refresh and thresholds.</p>
        </div>
      </header>

      <section class="panel">
        <h2>Toolbar badge</h2>
        <div class="grid">
          <label class="field">
            <span class="field__label">Show on the icon</span>
            <select id="badge-metric">
              <option value="todayCost">Spent today</option>
              <option value="monthCost">Spent in the period (30 days)</option>
              <option value="balance">Wallet balance</option>
              <option value="todayTokens">Tokens today</option>
            </select>
          </label>

          <label class="field">
            <span class="field__label">Measure for</span>
            <select id="badge-key">
              <option value="">All API keys</option>
            </select>
          </label>

          <label class="field">
            <span class="field__label">Number format</span>
            <select id="badge-format">
              <option value="auto">Auto</option>
              <option value="money">Money</option>
              <option value="tokens">Tokens</option>
            </select>
          </label>
        </div>
        <div class="preview">
          <span class="preview__label">Preview</span>
          <span id="badge-preview" class="preview__badge">—</span>
          <span id="badge-preview-title" class="muted"></span>
        </div>
        <p id="badge-preview-budget" class="muted preview__budget"></p>
      </section>

      <section class="panel">
        <h2>Refresh &amp; thresholds</h2>
        <div class="grid">
          <label class="field">
            <span class="field__label">Auto refresh (minutes, 0 = off)</span>
            <input id="refresh-minutes" type="number" min="0" max="1440" step="1" />
          </label>
          <label class="field">
            <span class="field__label">Aggregation window (days)</span>
            <input id="window-days" type="number" min="1" max="90" step="1" />
          </label>
          <label class="field">
            <span class="field__label">Low balance warning</span>
            <input id="low-balance" type="number" min="0" step="0.01" />
          </label>
          <label class="field">
            <span class="field__label">Daily budget (0 = off)</span>
            <input id="daily-budget" type="number" min="0" step="0.01" />
          </label>
          <label class="field">
            <span class="field__label">Warn at (% of budget)</span>
            <input id="budget-warn-percent" type="number" min="1" max="100" step="1" />
          </label>
          <label class="field field--checkbox">
            <input id="budget-notifications" type="checkbox" />
            <span>Notify when the budget is nearly used up / exceeded</span>
          </label>
          <label class="field field--checkbox">
            <input id="show-decimals" type="checkbox" />
            <span>Show decimals in the popup</span>
          </label>
        </div>
      </section>

      <section class="panel">
        <h2>Session</h2>
        <p id="session-status" class="muted">Checking…</p>
        <div class="actions">
          <button id="re-detect" class="button">Re-detect session</button>
          <button id="open-platform" class="button">Open platform.deepseek.com</button>
        </div>
      </section>

      <p id="saved" class="saved" hidden>Saved</p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
