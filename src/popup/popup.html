<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="popupTitle">DeepSeek Usage Monitor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img class="brand__logo" src="../../icons/icon128.png" alt="" width="64" height="64" />
        <div>
          <h1 data-i18n="popupTitle">DeepSeek Usage Monitor</h1>
          <p id="updated" class="muted" data-i18n="popupLoading">Loading…</p>
        </div>
      </div>
      <button
        id="refresh"
        class="icon-button"
        data-i18n-title="refreshNow"
        data-i18n-aria-label="refreshNow"
        title="Refresh now"
        aria-label="Refresh now"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"
          />
        </svg>
      </button>
    </header>

    <div id="error" class="banner banner--error" hidden>
      <span id="error-text"></span>
      <button id="error-fix" class="link-button" data-i18n="errorFix">Fix</button>
    </div>

    <a
      id="status"
      class="status"
      href="https://status.deepseek.com/"
      target="_blank"
      rel="noreferrer"
      data-i18n-title="openStatusPage"
      title="Open status page"
      hidden
    >
      <span id="status-icon" class="status__icon" aria-hidden="true"></span>
      <span id="status-text" class="status__text">—</span>
      <svg class="status__arrow" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
        <path
          fill="currentColor"
          d="M5 12h12m0 0-4-4m4 4-4 4"
          stroke="currentColor"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </a>

    <div id="layout" class="layout">
      <div class="section-wrap" data-section="summary">
        <section class="cards">
          <article class="card card--primary">
            <span class="card__label" data-i18n="walletBalance">Wallet balance</span>
            <strong id="balance" class="card__value">—</strong>
            <span id="balance-detail" class="card__hint">—</span>
          </article>
          <article class="card">
            <span class="card__label" data-i18n="spentToday">Spent today</span>
            <strong id="today-cost" class="card__value">—</strong>
            <span id="today-tokens" class="card__hint">—</span>
          </article>
        </section>
      </div>

      <div class="section-wrap" data-section="budgets">
        <section id="budgets" class="budgets" hidden>
          <div id="budget-list" class="budget-list"></div>
        </section>
      </div>

      <div class="section-wrap" data-section="forecast">
        <section id="forecast" class="section" hidden>
          <div class="forecast">
            <span class="forecast__label" data-i18n="forecastTitle">Projected today</span>
            <strong id="forecast-value" class="forecast__value">—</strong>
            <span id="forecast-note" class="forecast__note"></span>
          </div>
        </section>
      </div>

      <div class="section-wrap" data-section="chart">
        <section class="section">
          <div class="section__head">
            <h2 data-i18n="recentSpend">Recent spend</h2>
            <span id="chart-total" class="muted"></span>
          </div>
          <div
            id="chart"
            class="chart"
            role="img"
            data-i18n-aria-label="chartAria"
            aria-label="Daily spend for the last days"
          ></div>
          <div id="chart-legend" class="legend" hidden></div>
        </section>
      </div>

      <div class="section-wrap" data-section="models">
        <section id="models" class="section" hidden>
          <div class="section__head">
            <h2 data-i18n="modelsTitle">By model</h2>
            <span id="models-total" class="muted"></span>
          </div>
          <ul id="model-list" class="model-list"></ul>
          <p id="cache-note" class="cache-note" hidden></p>
        </section>
      </div>

      <div class="section-wrap" data-section="keys">
        <section class="section">
          <div class="section__head">
            <h2 data-i18n="apiKeys">API keys</h2>
            <div class="section__tools">
              <span id="key-selected" class="muted"></span>
              <button id="key-clear" class="link-button" data-i18n="allKeys" hidden>All keys</button>
            </div>
          </div>
          <ul id="key-list" class="key-list"></ul>
          <p id="key-empty" class="muted empty" data-i18n="noPerKeyUsage" hidden>
            No per-key usage in this period.
          </p>
        </section>
      </div>
    </div>

    <footer class="footer">
      <a id="open-usage" class="button button--primary" href="https://platform.deepseek.com/usage" target="_blank" rel="noreferrer">
        <span data-i18n="openUsagePage">Open usage page</span>
      </a>
      <button id="open-options" class="button" data-i18n-title="settings" title="Settings">
        <span data-i18n="settings">Settings</span>
      </button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
